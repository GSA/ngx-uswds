@if (_showBreadcrumbs) {
  <nav class="usa-breadcrumb" aria-label="Breadcrumbs" [ngClass]="{ 'usa-breadcrumb--wrap': wrap }">
    <ol class="usa-breadcrumb__list">
      @for (breadcrumb of _displayedCrumbs; track breadcrumb) {
        <li class="usa-breadcrumb__list-item">
          @if (breadcrumbLinkTemplate) {
            <ng-container
              [ngTemplateOutlet]="breadcrumbLinkTemplate.templateRef"
              [ngTemplateOutletContext]="{ $implicit: breadcrumb }"
            ></ng-container>
          } @else {
            <usa-link-template
              [link]="breadcrumb"
              [currentClass]="''"
              [class]="'usa-breadcrumb__link'"
              (linkClicked)="updateSelectedBreadcrumb($event)"
            >
            </usa-link-template>
          }
        </li>
      }
      <li class="usa-breadcrumb__list-item usa-current" aria-current="page">
        <span>{{ _selectedBreadcrumb.text }}</span>
      </li>
    </ol>
  </nav>
}
