<div class="usa-date-picker__calendar__date-picker">
  <usa-calendar-header></usa-calendar-header>
  <div>
    @switch (currentView) { @case ('month') {
    <usa-month-view
      #monthView
      [(activeDate)]="activeDate"
      [selected]="selected"
      [dateFilter]="dateFilter"
      [maxDate]="maxDate"
      [minDate]="minDate"
      [dateClass]="dateClass"
      [comparisonStart]="comparisonStart"
      [comparisonEnd]="comparisonEnd"
      (_userSelection)="_dateSelected($event)"
    >
    </usa-month-view>
    } @case ('year') {
    <usa-year-view
      #yearView
      [(activeDate)]="activeDate"
      [selected]="selected"
      [dateFilter]="dateFilter"
      [maxDate]="maxDate"
      [minDate]="minDate"
      [dateClass]="dateClass"
      (monthSelected)="_monthSelectedInYearView($event)"
      (selectedChange)="_goToDateInView($event, 'month')"
    >
    </usa-year-view>
    } @case ('multi-year') {
    <usa-multi-year-view
      #multiYearView
      [(activeDate)]="activeDate"
      [selected]="selected"
      [dateFilter]="dateFilter"
      [maxDate]="maxDate"
      [minDate]="minDate"
      [dateClass]="dateClass"
      (yearSelected)="_yearSelectedInMultiYearView($event)"
      (selectedChange)="_goToDateInView($event, 'month')"
    >
    </usa-multi-year-view>
    } }
  </div>
</div>
