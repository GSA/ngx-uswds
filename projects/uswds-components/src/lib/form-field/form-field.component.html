<div #labelDiv [class.usa-form-group--error]="!!errorMessage" class="usa-form-group">
  @if (!!label) {
    <label [attr.for]="id" class="usa-label" [class.usa-input-error-label]="errorMessage">
      {{ label || '' }}
      @if (required || requiredFlag) {
        <span> (Required) </span>
      }
    </label>
  }
  @if (description) {
    <div [attr.id]="id" class="usa-label--description form-text text-muted" [innerHTML]="description"></div>
  }
  @if (!!errorMessage) {
    <div class="usa-error-message" [style.display]="'block'" [attr.id]="errorElId">
      {{ errorMessage }}
    </div>
  }
  <ng-content></ng-content>
</div>
