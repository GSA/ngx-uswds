<ul class="usa-sidenav">
  @for (link of sidenavContent; track link) {
    <li class="usa-sidenav__item">
      <ng-container [ngTemplateOutlet]="sideNavLinkTemplate" [ngTemplateOutletContext]="{ $implicit: link }">
      </ng-container>
    </li>
  }
</ul>

<ng-template #sideNavLinkTemplate let-link>
  <usa-link-template [link]="link" (linkClicked)="onSidenavItemClicked($event)"></usa-link-template>
  @if (!expandType || (expandType && !link.collapsed)) {
    <div>
      <ul class="usa-sidenav__sublist">
        @for (link of link.children; track link) {
          <li class="sidenav__item">
            <ng-container [ngTemplateOutlet]="sideNavLinkTemplate" [ngTemplateOutletContext]="{ $implicit: link }">
            </ng-container>
          </li>
        }
      </ul>
    </div>
  }
</ng-template>
