export default "<ng-template #content let-modal>\n  <h2 class=\"usa-modal__heading\" id=\"modal-7-heading\">Open A Second Modal</h2>\n  <div class=\"usa-prose\">\n    <p id=\"modal-7-description\">Click button below to open a stacked modal</p>\n  </div>\n  <div class=\"usa-modal__footer\">\n    <ul class=\"usa-button-group\">\n      <li class=\"usa-button-group__item\">\n        <button type=\"button\" class=\"usa-button\" (click)=\"openModalB()\">Open second Modal</button>\n      </li>\n    </ul>\n  </div>\n  <pre>{{ closeBResult }}</pre>\n</ng-template>\n<button class=\"usa-button\" (click)=\"open(content)\">Launch Default modal</button>\n<hr />\n<pre>{{ closeResult }}</pre>\n";
