export default "<label class=\"usa-label\" id=\"allDisabledpickerLabel'\" for=\"allDisabledpicker\">Completely Disabled Datepicker</label>\n<div class=\"usa-hint\">mm/dd/yyyy</div>\n<usa-date-picker-wrapper>\n  <input [usaDatePicker]=\"allDisabledpicker\" [id]=\"'allDisabledpicker'\" disabled />\n  <usa-date-picker-button [for]=\"allDisabledpicker\"></usa-date-picker-button>\n  <usa-date-picker #allDisabledpicker></usa-date-picker>\n</usa-date-picker-wrapper>\n\n<label class=\"usa-label\" id=\"popupDisabledPickerLabel'\" for=\"popupDisabledPicker\">Popup Disabled Datepicker</label>\n<div class=\"usa-hint\">mm/dd/yyyy</div>\n<usa-date-picker-wrapper>\n  <input [usaDatePicker]=\"popupDisabledPicker\" [id]=\"'popupDisabledPicker'\" />\n  <usa-date-picker-button [for]=\"popupDisabledPicker\" disabled></usa-date-picker-button>\n  <usa-date-picker #popupDisabledPicker></usa-date-picker>\n</usa-date-picker-wrapper>\n\n<label class=\"usa-label\" id=\"inputDisabledpickerLabel'\" for=\"inputDisabledpicker\">Input Disabled Datepicker</label>\n<div class=\"usa-hint\">mm/dd/yyyy</div>\n<usa-date-picker-wrapper>\n  <input [usaDatePicker]=\"inputDisabledpicker\" [id]=\"'inputDisabledpicker'\" disabled />\n  <usa-date-picker-button [for]=\"inputDisabledpicker\"></usa-date-picker-button>\n  <usa-date-picker #inputDisabledpicker disabled=\"false\"></usa-date-picker>\n</usa-date-picker-wrapper>\n";
