export default "<ng-template #content let-modal>\n  <h2 class=\"usa-modal__heading\" id=\"modal-6-heading\">Are you sure you want to continue?</h2>\n  <div class=\"usa-prose\">\n    <p id=\"modal-6-description\">You have unsaved changes that will be lost.</p>\n  </div>\n  <div class=\"usa-modal__footer\">\n    <ul class=\"usa-button-group\">\n      <li class=\"usa-button-group__item\">\n        <button type=\"button\" class=\"usa-button\" (click)=\"close('Continue')\">Continue without saving</button>\n      </li>\n      <li class=\"usa-button-group__item\">\n        <button\n          type=\"button\"\n          usaAutoFocus\n          class=\"usa-button usa-button--unstyled padding-105 text-center\"\n          (click)=\"close('Go Back')\"\n        >\n          Go back\n        </button>\n      </li>\n    </ul>\n  </div>\n</ng-template>\n<div class=\"display-block margin-bottom-2\"><code>usaAutoFocus</code> on element to recieve focus on open</div>\n<button class=\"usa-button\" (click)=\"open(content)\">Auto Focus 'Go Back' button on open</button>\n<hr />\n<pre>{{ closeResult }}</pre>\n";
