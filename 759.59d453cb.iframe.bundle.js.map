export default "<label class=\"usa-label\" for=\"basicInput\">Basic Textarea</label>\n\n<usa-textarea\n  [rowHeight]=\"6\"\n  [label]=\"'Text Area label'\"\n  [description]=\"description\"\n  [maxlength]=\"100\"\n  id=\"basicInput\"\n  [required]=\"true\"\n  (onBlur)=\"updateValue($event)\"\n></usa-textarea>\n\n<p>{{ value }}</p>\n\n<label class=\"usa-label\" for=\"textareacharactercount\">Textarea with Character Count</label>\n\n<usa-textarea [rowHeight]=\"6\" [maxlength]=\"100\" id=\"textareacharactercount\" [usaCharacterCount]=\"50\"></usa-textarea>\n";
