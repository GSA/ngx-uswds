export default "<label class=\"usa-label\" id=\"datepickerFormatLabel'\" for=\"datepickerFormat\">Datepicker Format</label>\n<div class=\"usa-hint\">month dd, yyyy</div>\n<usa-date-picker-wrapper>\n  <input [usaDatePicker]=\"picker\" [id]=\"'datepickerFormat'\" />\n  <usa-date-picker-button [for]=\"picker\"></usa-date-picker-button>\n  <usa-date-picker #picker></usa-date-picker>\n</usa-date-picker-wrapper>\n";
