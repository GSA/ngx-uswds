export default "<legend class=\"usa-legend\">Select one historical figure</legend>\n<usa-dropdown [(ngModel)]=\"templateModel\" [options]=\"dropdownOptions\"></usa-dropdown>\n\n<div class=\"margin-top-2\">\n  Selected Value: <code>{{ templateModel | json }}</code>\n</div>\n\n<legend class=\"usa-legend margin-top-5\">Select one historical figure</legend>\n<usa-dropdown [formControl]=\"reactiveFormControl\" [options]=\"dropdownOptions\"></usa-dropdown>\n<div class=\"margin-top-2\">\n  Selected Value: <code>{{ reactiveFormControl.value | json }}</code>\n</div>\n";
