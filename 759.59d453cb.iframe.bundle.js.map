export default "<usa-step-indicator\n  [steps]=\"steps\"\n  [(currentStep)]=\"currentStep\"\n  [hideLabels]=\"hideLabels\"\n  [centerLabels]=\"centerLabels\"\n  [displayCounters]=\"displayCounters\"\n  [smallCounters]=\"smallCounters\"\n  [headerPosition]=\"headerPosition\"\n  [disableStepSelection]=\"disableStepSelection\"\n>\n  <h2 UsaStepHeader [template]=\"headerTemplate\">\n    <ng-template #headerTemplate> Custom Header {{steps[currentStep]?.label}} </ng-template>\n  </h2>\n</usa-step-indicator>\n";
