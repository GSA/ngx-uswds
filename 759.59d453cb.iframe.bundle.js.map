export default "<div class=\"grid-row\">\n  <div class=\"desktop:grid-col-5 tablet: grid-col-12\">\n    <!-- Min Date -->\n    <label class=\"usa-label\" id=\"minDatePickerLabel'\" for=\"minDatePicker\">Min Date</label>\n    <usa-date-picker-wrapper>\n      <input [usaDatePicker]=\"minPicker\" [id]=\"'minDatePicker'\" [(ngModel)]=\"minDateModel\" [max]=\"maxDateModel\" />\n      <usa-date-picker-button [for]=\"minPicker\"></usa-date-picker-button>\n      <usa-date-picker #minPicker></usa-date-picker>\n    </usa-date-picker-wrapper>\n  </div>\n  <div class=\"desktop:grid-col-5 tablet: grid-col-12\">\n    <!-- Max Date -->\n    <label class=\"usa-label\" id=\"maxDatePickerLabel'\" for=\"maxDatePicker\">Max Date</label>\n    <usa-date-picker-wrapper>\n      <input [usaDatePicker]=\"maxPicker\" [id]=\"'maxDatePicker'\" [(ngModel)]=\"maxDateModel\" [min]=\"minDateModel\" />\n      <usa-date-picker-button [for]=\"maxPicker\"></usa-date-picker-button>\n      <usa-date-picker #maxPicker></usa-date-picker>\n    </usa-date-picker-wrapper>\n  </div>\n</div>\n\n<!-- Validation Date -->\n<label class=\"usa-label\" id=\"datePickerValidationLabel'\" for=\"datePickerValidation\">Date Picker Validation</label>\n<usa-date-picker-wrapper>\n  <input\n    [usaDatePicker]=\"validationPicker\"\n    [id]=\"'datePickerValidation'\"\n    required\n    [attr.class]=\"isInvalid(datePickerValidation) ? 'usa-input usa-input--error' : 'usa-input'\"\n    [(ngModel)]=\"validationModel\"\n    [min]=\"minDateModel\"\n    [max]=\"maxDateModel\"\n    #datePickerValidation=\"ngModel\"\n  />\n  <usa-date-picker-button [for]=\"validationPicker\"></usa-date-picker-button>\n  <usa-date-picker #validationPicker></usa-date-picker>\n</usa-date-picker-wrapper>\n\n<div *ngIf=\"isInvalid(datePickerValidation)\" class=\"usa-error-message\">\n  <div *ngIf=\"datePickerValidation.errors?.usaDatePickerMin\">Date must be after {{ minDateModel.toDateString() }}</div>\n  <div *ngIf=\"datePickerValidation.errors?.usaDatePickerMax\">Date must be before {{ maxDateModel.toDateString() }}</div>\n  <div *ngIf=\"datePickerValidation.errors?.required\">Date is required</div>\n</div>\n";
