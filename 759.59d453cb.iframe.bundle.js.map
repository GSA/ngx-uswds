export default "<usa-radio-group [name]=\"name\" (change)=\"onRadioChange($event)\" [ariaLabelledBy]=\"ariaLabelledBy\">\n  <h4 id=\"{{ ariaLabelledBy }}\" usaRadioGroupLabel>Historical Figures</h4>\n  <usa-radio [id]=\"'historical-truth'\" value=\"sojourner-truth\" [checked]=\"checked\" [tile]=\"tile\"\n    >Sojourner Truth</usa-radio\n  >\n  <usa-radio [id]=\"'historical-douglass'\" value=\"frederick-douglass\" [tile]=\"tile\">Frederick Douglass</usa-radio>\n  <usa-radio [id]=\"'historical-washington'\" value=\"booker-t-washington\" [tile]=\"tile\">Booker T. Washington</usa-radio>\n  <usa-radio [disabled]=\"disabled\" [id]=\"'historical-carver'\" value=\"george-washington-carver\" [tile]=\"tile\"\n    >George Washington Carver</usa-radio\n  >\n</usa-radio-group>\n";
