export default "<label class=\"usa-label\" id=\"filterDatepickerLabel'\" for=\"filterDatepicker\">Filter Date Picker</label>\n<div class=\"usa-hint\">Please select a day</div>\n<usa-date-picker-wrapper>\n  <input [usaDatePicker]=\"picker\" [id]=\"'filterDatepicker'\" [usaDatePickerFilter]=\"weekdaysOnlyFilter\" />\n  <usa-date-picker-button [for]=\"picker\"></usa-date-picker-button>\n  <usa-date-picker #picker></usa-date-picker>\n</usa-date-picker-wrapper>\n";
