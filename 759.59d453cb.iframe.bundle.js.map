export default "<usa-search\n  [buttonText]=\"buttonText\"\n  [size]=\"size\"\n  [placeholder]=\"placeholder\"\n  [id]=\"id\"\n  [ariaLabel]=\"ariaLabel\"\n  [name]=\"name\"\n  (searchTextChange)=\"searchTextChange($event)\"\n  (onBlur)=\"onBlur($event)\"\n  (onTextSubmit)=\"onTextSubmit($event)\"\n>\n</usa-search>\n";
