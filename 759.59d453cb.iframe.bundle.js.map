export default "<div uswds-card class=\"margin-top-2 margin-bottom-4\">\n  <uswds-card-header>\n    <div class=\"pin-right margin-right-4\">\n      <button\n        class=\"usa-button usa-button--unstyled margin-left-1\"\n        *ngIf=\"code\"\n        (click)=\"showCode = !showCode\"\n        aria-label=\"Show Code\"\n      >\n        {{ showCode ? 'Hide' : 'Show' }} Code\n      </button>\n      <a\n        class=\"usa-button usa-button--unstyled margin-left-1\"\n        *ngIf=\"getGithubLink()\"\n        [attr.href]=\"getGithubLink()\"\n        target=\"_blank\"\n        [attr.aria-label]=\"'Open new window for ' + demoTitle + ' in github'\"\n      >\n        Github\n      </a>\n    </div>\n    <h2 *ngIf=\"demoTitle && demoTitle.length > 0\" class=\"grid-col-5\">\n      {{ demoTitle }}\n    </h2>\n  </uswds-card-header>\n\n  <uswds-card-body>\n    <div *ngIf=\"showCode\" class=\"padding-bottom-2 border font-mono-sm margin-bottom-2\">\n      <div class=\"border-bottom\">\n        <ng-container *ngFor=\"let tab of tabs\">\n          <button\n            class=\"usa-button usa-button--outline margin-3\"\n            [ngClass]=\"{ 'usa-button--active': tab.type === activeTab }\"\n            (click)=\"activeTab = tab.type\"\n          >\n            {{ tab.name }}\n          </button>\n        </ng-container>\n      </div>\n      <pre class=\"highlight overflow-auto\" *ngIf=\"activeTab === 'code'\"><code [highlight]=\"code.default\"></code></pre>\n      <pre\n        class=\"highlight overflow-auto\"\n        *ngIf=\"activeTab === 'markUp'\"\n      ><code [highlight]=\"markup.default\"></code></pre>\n      <pre\n        class=\"highlight overflow-auto\"\n        *ngIf=\"activeTab === 'module'\"\n      ><code [highlight]=\"module.default\"></code></pre>\n    </div>\n\n    <ng-content></ng-content>\n  </uswds-card-body>\n</div>\n";
