export default "<usa-table [displayedData]=\"displyedData\" [trackBy]=\"trackByFn\">\n  <caption>\n    Dynamically Add / Remove data rows\n  </caption>\n  <ng-container usaColumnDef=\"title\">\n    <th usa-table-header *usaTableHeaderDef>Document Title <button usa-sort></button></th>\n    <td usa-table-data *usaTableDataDef=\"let document\" data-label=\"Document Title\">{{ document.title }}</td>\n  </ng-container>\n  <ng-container usaColumnDef=\"description\">\n    <th usa-table-header *usaTableHeaderDef>Description</th>\n    <td usa-table-data *usaTableDataDef=\"let document\" data-label=\"Description\">{{ document.description }}</td>\n  </ng-container>\n  <ng-container usaColumnDef=\"year\">\n    <th usa-table-header *usaTableHeaderDef>Year</th>\n    <td usa-table-data *usaTableDataDef=\"let document\" data-label=\"Year\">{{ document.year }}</td>\n  </ng-container>\n  <ng-container usaColumnDef=\"settings\">\n    <th usa-table-header *usaTableHeaderDef>Remove</th>\n    <td usa-table-data *usaTableDataDef=\"let document; let index = index\" data-label=\"Year\">\n      <button class=\"usa-button\" (click)=\"onRemoveRowClicked(year, index)\">Remove Row</button>\n    </td>\n  </ng-container>\n\n  <tr *usaHeaderRowDef=\"displayedColumns\"></tr>\n  <tr *usaDataRowDef=\"let row; columns: displayedColumns\"></tr>\n</usa-table>\n\n<button class=\"usa-button\" (click)=\"addLastDataRow()\">Add Last Removed Data Row</button>\n";
