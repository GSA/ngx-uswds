export default "<label for=\"combo-box-template\" class=\"usa-sr-only\">Combo Box With Template and Service Data</label>\n<usa-combobox\n  [items]=\"mockdata$ | waitForAsync\"\n  labelField=\"name\"\n  valueField=\"id\"\n  [ngModel]=\"searchValue\"\n  (ngModelChange)=\"onValueChange($event)\"\n  (scrollEnd)=\"onScrollEnd()\"\n  [id]=\"'combo-box-template'\"\n>\n  <div *usa-combo-box-item-template=\"let item\">\n    <div class=\"text-bold\">{{ item.name }}</div>\n    <div>{{ item.email }}</div>\n    <div>{{ item.phone }}</div>\n  </div>\n</usa-combobox>\n<p>Value: {{ searchValue }}</p>\n";
