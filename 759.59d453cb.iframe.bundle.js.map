export default "<label for=\"fileInputMultipleId\" class=\"usa-label\">Multiple File Input With Server Side Delay</label>\n<usa-file-input\n  [id]=\"'fileInputMultipleId'\"\n  [multiple]=\"true\"\n  [uploadRequest]=\"simulateServerDelay ? uploadFilesMethod : undefined\"\n  (selectedFilesChange)=\"onFilesChange($event)\"\n  (uploadError)=\"onUploadError($event)\"\n>\n</usa-file-input>\n\n<button class=\"usa-button margin-top-2\" (click)=\"simulateServerDelay = !simulateServerDelay\">\n  Toggle Server Side Upload Delay\n</button>\n<button class=\"usa-button margin-top-2\" (click)=\"onToggleServerSideResponse()\">Toggle Server Side Response</button>\n\n<p>\n  <code class=\"display-block\">[uploadRequest]=\"(file: File) => Observable\"</code>\n  <span *ngIf=\"simulateServerDelay; else hidden\"\n    >Simulating delay from server side. Response will be {{ serverResponseSucceeds ? 'OK' : 'error' }}</span\n  >\n  <ng-template #hidden> No request to server </ng-template>\n</p>\n<p *ngFor=\"let failedUpload of failedUploads\" class=\"text-red\">{{ failedUpload.name }} failed to upload</p>\n";
