export default "<usa-breadcrumb\n  #breadcrumbs\n  [items]=\"items\"\n  [wrap]=\"wrap\"\n  [hideSingleCrumb]=\"hideSingleCrumb\"\n  (selected)=\"onSelection($event)\"\n>\n</usa-breadcrumb>\n\n<button\n  (click)=\"breadcrumbs.updateSelectedBreadcrumb(items[items.length - 1])\"\n  class=\"usa-button display-block margin-top-3\"\n>\n  Reset\n</button>\n";
