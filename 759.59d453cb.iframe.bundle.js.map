export default "<label class=\"usa-label\" id=\"basicDatePickerLabel'\" for=\"basicDatePicker\">Basic Date Picker</label>\n<div class=\"usa-hint\">mm/dd/yyyy</div>\n<usa-date-picker-wrapper>\n  <input [usaDatePicker]=\"picker\" [id]=\"'basicDatePicker'\" />\n  <usa-date-picker-button [for]=\"picker\"></usa-date-picker-button>\n  <usa-date-picker #picker (opened)=\"calendarOpen()\" (closed)=\"calendarClosed()\"> </usa-date-picker>\n</usa-date-picker-wrapper>\n";
