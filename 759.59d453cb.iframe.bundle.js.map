export default "<usa-header\n  #header\n  [title]=\"title\"\n  [navAriaLabel]=\"navAriaLabel\"\n  [secondaryNavItems]=\"secondaryNavItems\"\n  [primaryNavItems]=\"primaryNavItems\"\n  [extended]=\"extended\"\n  [displayOverlayOnMenuOpen]=\"displayOverlayOnMenuOpen\"\n  (linkEvent)=\"linkEvent($event)\"\n>\n  <!-- Add extra content after the secondary navigation link if needed -->\n  <usa-search usaHeaderSecondaryExtra [size]=\"'small'\"></usa-search>\n\n  <!-- Define your own template for seconday navigation link through this directive -->\n  <ng-template usaHeaderSecondaryLinkTemplate let-link>\n    <div href=\"javascript:void\" class=\"text-secondary display-inline-block cursor-pointer\">{{ link.text }}</div>\n  </ng-template>\n</usa-header>\n";
