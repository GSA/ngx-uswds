---
name: ci build

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Check out repository code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # SHA pin
            - name: Setup Node
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # SHA pin
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - name: Install Node Packages
              run: npm ci
            - name: Run lint
              run: npm run lint

    build_and_run_tests:
        name: Build and Run Tests
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Check out repository code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # SHA pin
            - name: Setup Node
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # SHA pin
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - name: Install Node Packages
              run: npm ci
            - name: Build the project
              run: |
                npm run build:components \
                && npm run build:formly
            - name: Run component tests with coverage
              id: component-tests
              # formly code does not have tests at all; scope coverage to components
              run: npm run test:components
            - name: Upload component coverage artifact
              if: ${{ steps.component-tests.outcome == 'success' }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: uswds-components-coverage
                  path: coverage/uswds-components/**
                  if-no-files-found: error
