name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # SHA pin

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # SHA pin
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node Packages
        run: npm ci

      - name: Build the demo runtime
        run: npm run build:demo -- --configuration production

      - name: Serve the demo runtime with production security headers
        run: node scripts/serve-security-scan.mjs &

      - name: Wait for the demo runtime
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4200/ >/dev/null && exit 0
            sleep 1
          done
          echo "Demo runtime did not start within 30 seconds" >&2
          exit 1

      - name: Scan runtime with OWASP ZAP
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://127.0.0.1:4200'
          fail_action: false
          allow_issue_writing: false
          cmd_options: '-a'

      - name: Enforce medium/high severity gate
        run: node scripts/check-zap-severity.mjs report_json.json .zap/rules.tsv

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-report
          path: report_*.html
          if-no-files-found: warn
