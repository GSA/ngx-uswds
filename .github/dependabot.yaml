version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
      semver-major-days: 60
    ignore:
      - dependency-name: '@angular-devkit/architect'
        versions: ['>= 0.2200.0']
      - dependency-name: '@angular/*'
        versions: ['>= 22.0.0']
      - dependency-name: '@angular-devkit/*'
        versions: ['>= 0.2200.0 < 1.0.0', '>= 22.0.0']
      - dependency-name: '@angular-eslint/*'
        versions: ['>= 22.0.0']
      - dependency-name: '@gsa-sam/*'
        versions: ['>= 22.0.0']
      - dependency-name: 'angular-eslint'
        versions: ['>= 22.0.0']
      - dependency-name: 'ng-packagr'
        versions: ['>= 22.0.0']
      - dependency-name: 'ngx-markdown'
        versions: ['>= 22.0.0']
      - dependency-name: 'typescript'
        versions: ['>= 6.0.0']
    groups:
      # Keep coupled toolchains ahead of the catch-all groups (first match wins).
      # animations and platform-browser-dynamic are deprecated on npm, so Dependabot skips them.
      # If an angular group PR fails npm ci with ERESOLVE, push a commit to that PR
      # bumping those two packages to the same version as the other Angular framework packages.
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - '@angular-eslint/*'
          - 'angular-eslint'
          - '@schematics/angular'
          - 'ng-packagr'
        update-types:
          - 'minor'
          - 'patch'
      storybook:
        patterns:
          - 'storybook'
          - '@storybook/*'
          - 'eslint-plugin-storybook'
        update-types:
          - 'minor'
          - 'patch'
      minor:
        patterns:
          - '*'
        update-types:
          - 'minor'
      patch:
        patterns:
          - '*'
        update-types:
          - 'patch'
    # Major updates are intentionally ungrouped so each opens as its own PR
    # and requires human review — they are never auto-merged.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
